<svg xmlns="http://www.w3.org/2000/svg" width="460" height="138" viewBox="0 0 460 138">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
      font-size: 22px;
      font-weight: 700;
    }
    .label { fill: #8a8a8a; }
    .value { fill: #24292f; }
    .pol { fill: #1e8bff; }
    .rob { fill: #ffc21a; }
    @media (prefers-color-scheme: dark) {
      .value { fill: #f0f0f0; }
    }
  </style>
  <text x="0" y="26">
    <tspan class="label">Name : </tspan>
    <tspan class="pol">Pol</tspan><tspan class="rob">Rob</tspan>
  </text>
  <text x="0" y="78">
    <tspan class="label">Category : </tspan>
    <tspan class="value">Mobile Game</tspan>
  </text>
  <text x="0" y="130">
    <tspan class="label">Description : </tspan>
    <tspan class="value">경찰과 도둑이 펼치는 추격전</tspan>
  </text>
</svg>
